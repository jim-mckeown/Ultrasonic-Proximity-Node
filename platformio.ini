; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings for Ultrasonic-Proximity-Node

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- MATCH ARDUINO IDE FLASH DEFAULTS ---
board_build.flash_mode = dio
board_build.partitions = default.csv   ; Standard 4MB partition layout used by Arduino IDE

; --- OTA CONFIGURATION ---
upload_protocol = espota
upload_port = 192.168.1.108            ; Your ESP32's actual IP address
upload_flags =
    --port=3232
    --auth=admin                       ; Omit if otaPassword is empty

lib_deps =
    https://github.com/tzapu/WiFiManager.git
    https://github.com/jim-mckeown/ESP32-UDP-Parameter-Server-Class.git

